name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        echo "=== Before cleanup ==="
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        sudo docker image prune -af
        echo "=== After cleanup ==="
        df -h /

    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/${{ github.repository_owner }}/image-gen:1.0.0-cu128

    - name: Check image size
      run: |
        echo "=== Docker image size ==="
        docker images ghcr.io/${{ github.repository_owner }}/image-gen:1.0.0-cu128 --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"
        echo ""
        echo "=== Disk usage on runner ==="
        df -h /

    - name: Push image to ghcr.io
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/image-gen:1.0.0-cu128
